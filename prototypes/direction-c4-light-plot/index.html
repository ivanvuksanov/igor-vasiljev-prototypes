<script>
// PROTOTYPE: set the light before first paint. ?light=work|show wins (for screenshots), then the saved choice, then the page default.
(function(){var d=document.documentElement,l=null;try{var m=location.search.match(/[?&]light=(work|show)/);l=m?m[1]:localStorage.getItem('igor-light')}catch(e){}
if(l!=='work'&&l!=='show')l=d.getAttribute('data-default-light')||'show';d.setAttribute('data-light',l);})();
</script>
</head>
<body data-page="home">
<main><section id="stage" aria-label="Works on stage"></section><section id="list" class="lit" aria-label="List of works"></section></main>
